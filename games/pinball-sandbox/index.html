<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RECESS — Pinball Sandbox</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%238fd3ff'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23cc2222' stroke-width='2' stroke-dasharray='4 3'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
  #view { display: block; width: 100vw; height: 100vh; touch-action: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  #readout {
    position: fixed; top: 10px; left: 10px; z-index: 2;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #d8e8ff; background: rgba(10, 14, 24, 0.72);
    padding: 8px 12px; border-radius: 6px; white-space: pre; pointer-events: none;
  }
  #panel {
    position: fixed; top: 10px; right: 10px; z-index: 3; width: 240px; max-height: 96vh;
    overflow-y: auto; font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #d8e8ff; background: rgba(10, 14, 24, 0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 10px;
  }
  #panel h1 { font-size: 12px; margin: 0 0 8px; color: #8fd3ff; font-weight: 600; }
  #panel .row { margin-bottom: 8px; }
  #panel .row label { display: flex; justify-content: space-between; margin-bottom: 2px; }
  #panel .row .val { color: #ffd27a; }
  #panel .row input[type="range"] { width: 100%; }
  #panel button {
    width: 100%; margin-top: 4px; padding: 6px; border-radius: 6px; border: none;
    background: #2a3a4a; color: #d8e8ff; font: 11px ui-monospace, Menlo, Consolas, monospace;
    cursor: pointer;
  }
  #panel button:hover { background: #38506a; }
  #panel .hint { color: #7a8ba0; margin-top: 8px; font-size: 10px; }
  #flipReadout {
    position: fixed; bottom: 10px; left: 10px; z-index: 2;
    font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace;
    color: #d8e8ff; background: rgba(10, 14, 24, 0.72);
    padding: 8px 12px; border-radius: 6px; white-space: pre; pointer-events: none;
    min-width: 220px;
  }
  #scenarioPanel {
    position: fixed; bottom: 10px; right: 10px; z-index: 3; width: 260px;
    font: 11px/1.4 ui-monospace, Menlo, Consolas, monospace;
    color: #d8e8ff; background: rgba(10, 14, 24, 0.85); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 8px; padding: 10px;
  }
  #scenarioPanel h1 { font-size: 12px; margin: 0 0 8px; color: #8fd3ff; font-weight: 600; }
  #scenarioPanel button {
    width: 100%; margin-bottom: 6px; padding: 6px; border-radius: 6px; border: none;
    background: #2a3a4a; color: #d8e8ff; font: 11px ui-monospace, Menlo, Consolas, monospace;
    cursor: pointer; text-align: left;
  }
  #scenarioPanel button:hover { background: #38506a; }
  #scenarioReadout { white-space: pre-wrap; margin: 0; color: #ffd27a; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "../pinball/vendor/three.module.js"
  }
}
</script>
</head>
<body>
<canvas id="view"></canvas>
<pre id="readout">no ball placed yet — click the playfield</pre>
<div id="panel"></div>
<pre id="flipReadout">no flip yet</pre>
<div id="scenarioPanel"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
