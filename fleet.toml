[settings]
cache_ttl_minutes = 60
default_profile = "v2"

[thread.sonnet]
model = "claude-sonnet-5"
tier = "hot"
persist = "singular"
baseline = ["briefs/sonnet.md"]
mcp = "core"
dirs = ["/Users/pup"]
permission_mode = "default"
effort = "medium"

[thread.opus]
model = "claude-opus-5"
tier = "warm"
persist = "on-demand"
baseline = ["briefs/opus.md"]
forkable = true
settings = "settings/unattended.json"

[thread.fable]
model = "claude-fable-5"
tier = "dormant"
persist = "on-demand"
baseline = ["briefs/fable.md"]
resume_policy = "packet-first"
settings = "settings/unattended.json"

[thread.haiku-fs]
model = "claude-haiku-4-5"
tier = "tool"
persist = "respawn"
baseline = ["briefs/haiku-fs.md", "maps/projects.md", "maps/conventions.md"]
effort = "low"
settings = "settings/unattended.json"

[profile.v2]
session = "fleet2"
briefs = "briefs/v2"

[profile.v2.thread.sonnet2]
model = "claude-sonnet-5"
tier = "hot"
persist = "singular"
baseline = ["briefs/v2/sonnet.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "acceptEdits"
effort = "medium"
settings = "settings/v2/hot.json"

[profile.v2.thread.sonnet3]
model = "claude-sonnet-5"
tier = "hot"
persist = "singular"
baseline = ["briefs/v2/sonnet3.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "acceptEdits"
effort = "medium"
settings = "settings/v2/hot.json"

# Operator tooling. Not a project thread: sonnet4's subject is the fleet's own
# observability, because the operator manages a dozen threads across several projects
# out of a context that compacts. On 2026-09-06 two dispatches sat unanswered for hours
# and the whole fleet went idle, and in both cases the operator found out from the user
# rather than from any instrument.
[profile.v2.thread.sonnet4]
model = "claude-sonnet-5"
tier = "hot"
persist = "singular"
baseline = ["briefs/v2/sonnet.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "acceptEdits"
effort = "medium"
