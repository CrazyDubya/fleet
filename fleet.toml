# Was the lane advisor. Retired that role 2026-09-06: its verdict arrives as
# `[router] @lane ...`, but the operator sets @lane in every dispatch header, so nothing
# ever consulted it — zero handoffs in its whole life. Repurposed as a seventh fs tool.
# Name kept rather than changed because other briefs still reference it by name; the name
# is stale, the config is not.
[profile.v2.thread.haiku-router2]
model = "claude-haiku-4-5"
tier = "tool"
persist = "respawn"
baseline = ["briefs/v2/haiku-fs.md", "maps/projects.md", "maps/conventions.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "bypassPermissions"
effort = "low"
settings = "settings/v2/tool.json"

[profile.v2.thread.haiku-agy2]
model = "claude-haiku-4-5"
tier = "tool"
persist = "respawn"
baseline = ["briefs/v2/_protocol.md", "briefs/v2/haiku-agy.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "bypassPermissions"
effort = "low"
settings = "settings/v2/tool.json"

# grok bills per call — a trivial prompt measured $0.0067, because every invocation
# carries ~18-24k input tokens before the prompt. Its brief makes cost the first line of
# every reply for that reason. It is also the only harness here with no resume-by-id:
# --continue takes the most recent session in the cwd, so two conversations in one
# directory cross silently.
[profile.v2.thread.haiku-grok2]
model = "claude-haiku-4-5"
tier = "tool"
persist = "respawn"
baseline = ["briefs/v2/_protocol.md", "briefs/v2/haiku-grok.md"]
mcp = "browser"
dirs = ["/Users/pup"]
permission_mode = "bypassPermissions"
effort = "low"
settings = "settings/v2/tool.json"

[profile.v2.thread.muse2]
model = "claude-sonnet-5"
tier = "hot"
persist = "on-demand"
baseline = ["briefs/v2/_protocol.md", "briefs/v2/muse.md"]
mcp = "browser"
dir = "/Users/pup/muse"
dirs = ["/Users/pup/fleet"]
permission_mode = "acceptEdits"
effort = "medium"
settings = "settings/v2/project-muse.json"

# Repos fleet watches but does not own. Health comes from whatever the project
# already publishes; fleet never instruments it. See fleet/projects.py.
[[project]]
name = "muse"
dir = "/Users/pup/muse"
thread = "muse2"
status_glob = "pipeline/status-*.md"
state_re = 'state:\s*\*\*([A-Z][A-Z ]*[A-Z]|[A-Z])\*\*'  # multi-word: NO ACTIVITY, not just \w+
ok_states = ["OK", "GREEN"]
